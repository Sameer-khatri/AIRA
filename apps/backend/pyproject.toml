[project]
name = "aira-backend"
version = "0.1.0"
description = "AIRA local backend engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlmodel",
    "python-dotenv",
    "ollama"
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.pyrefly]
# Only analyse real source files — ignore Pyrefly's own virtual in-memory stubs
project_includes = ["app"]
# Exclude prompt/personality files: their content is natural language, not Python
ignore_errors_in_files = [
    "app/core/brain/personality.py",
]
